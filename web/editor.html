/* ---------------------------------------------------------- samples --- */
const smpDraft = [0, 1, 2].map(() => ({ name: "", files: [] }));
let smpBusy = false;
const SMP_RC = { 1: "size", 2: "header", 3: "data CRC", 4: "flash", 5: "zones" };
const kib = (n) => (n / 1024).toFixed(1);

/* auto key split, as in buildSlot (for the preview) */
function splitKeys(files) {
  const z = files.map((f, i) => ({ i, root: f.root })).sort((a, b) => a.root - b.root);
  const out = [];
  z.forEach((x, j) => {
    out[x.i] = [j === 0 ? 0 : Math.floor((z[j - 1].root + x.root) / 2) + 1, j === z.length - 1 ? 127 : Math.floor((x.root + z[j + 1].root) / 2)];
  });
  return out;
}
const draftBytes = (d) => d.files.reduce((a, f) => a + ((f.s.length + 1) >> 1), 0);

async function decodeFile(f) {
  const buf = await f.arrayBuffer();
  let x;
  try {
    const w = parseWav(buf);
    x = resample(w.x, w.sr, SMP.RATE);
  } catch (e) {                                     /* not a plain WAV: let the browser decode it */
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
    x = new Float64Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  }
  if (!x.length) throw new Error("no audio");
  const raw = Float64Array.from(x);                 /* kept for trimming: s is raw[a, b) (takeSample) */
  return { fname: f.name, raw, a: 0, b: raw.length, s: takeSample(raw, 0, raw.length),
           root: rootFromName(f.name.replace(/\.[^.]*$/, "")) };
}

/* ---- recording: the computer's input (getUserMedia, no echo cancelling / noise suppression / AGC),
 * raw PCM through an AudioWorklet, mixed to mono; it stops by itself when the slot is full */
const REC_WORKLET = `registerProcessor("felucca-rec", class extends AudioWorkletProcessor {
  process(inputs) {
    const i = inputs[0];
    if (i && i.length && i[0].length) {
      const n = i[0].length, m = new Float32Array(n);
      for (let c = 0; c < i.length; c++) for (let k = 0; k < n; k++) m[k] += i[c][k] / i.length;
      this.port.postMessage(m, [m.buffer]);
    }
    return true;
  }
});`;
let rec = null;                                     /* the recording: { k, ctx, stream, chunks, n, max, peak } */
let recDevice = "", recInputs = [];                 /* the chosen input (deviceId, "" = default), the inputs */

async function listInputs() {
  try { recInputs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput"); }
  catch (e) { recInputs = []; }
}

let recStarting = false, recEpoch = 0;               /* cancel a pending permission / worklet on leave */
const recActive = () => !!rec || recStarting;       /* the draft must not change: Upload, files, trims off */
async function recStart(k) {
  const d = smpDraft[k], left = SMP.MAX_DATA - draftBytes(d);   /* bytes: two samples each */
  if (!dev || tab !== "samples" || rec || recStarting || smpBusy) return;
  const session = dev, epoch = ++recEpoch;
  const current = () => epoch === recEpoch && dev === session && tab === "samples";
  const check = () => { if (!current()) throw new Error("closed"); };
  if (left < 1024 || d.files.length >= SMP.MAX_ZONES) { sayK("recFull"); return; }
  let stream = null, ctx = null;
  recStarting = true;
  renderSamples();                                  /* (the controls go off during the prompt) */
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      deviceId: recDevice ? { exact: recDevice } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    check();
    ctx = new AudioContext();
    await ctx.resume();                             /* (made after the permission prompt: it may start suspended) */
    check();
    const url = URL.createObjectURL(new Blob([REC_WORKLET], { type: "text/javascript" }));
    try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
    check();
    const node = new AudioWorkletNode(ctx, "felucca-rec"), mute = ctx.createGain();
    mute.gain.value = 0;                            /* pulled by the graph, but nothing is heard */
    ctx.createMediaStreamSource(stream).connect(node).connect(mute).connect(ctx.destination);
    rec = { k, ctx, stream, chunks: [], n: 0, max: Math.floor(left * 2 * ctx.sampleRate / SMP.RATE), peak: 0 };
    node.port.onmessage = (e) => {
      const r = rec;
      if (!r || r.ctx !== ctx || r.stopping) return;
      const chunk = e.data.subarray(0, Math.max(0, r.max - r.n));
      r.chunks.push(chunk);
      r.n += chunk.length;
      for (const v of e.data) r.peak = Math.max(r.peak, Math.abs(v));
      if (r.n >= r.max) recStop();
    };
    await listInputs();                             /* the labels come with the permission */
    check();
    recStarting = false;
    renderSamples();
    requestAnimationFrame(recTick);
  } catch (e) {                                     /* nothing stays open: the input, the context */
    if (epoch === recEpoch) recStarting = false;
    if (rec && rec.ctx === ctx) rec = null;
    if (stream) stream.getTracks().forEach((tr) => tr.stop());
    if (ctx) ctx.close().catch(() => {});
    if (e.message !== "closed" && current()) sayK("recDenied", ": " + e.message);
    renderSamples();
  }
}

/* the time and the level while recording (no re-render) */
function recTick() {
  if (!rec) return;
  const box = $("smpslots").querySelector(`[data-k="${rec.k}"]`);
  const lv = box && box.querySelector("progress.rec"), tm = box && box.querySelector(".rectime");
  if (lv) lv.value = Math.min(1, rec.peak);
  if (tm) tm.textContent = `${(rec.n / rec.ctx.sampleRate).toFixed(1)} / ${(rec.max / rec.ctx.sampleRate).toFixed(1)} s`;
  rec.peak *= 0.8;
  requestAnimationFrame(recTick);
}

/* rec stays set (stopping) until the recording is in the draft: Upload and Record stay off meanwhile */
async function recStop() {
  const r = rec;
  if (!r || r.stopping) return;
  r.stopping = true;
  r.stream.getTracks().forEach((tr) => tr.stop());
  await r.ctx.close().catch(() => {});
  if (rec === r) rec = null;
  const x = new Float64Array(Math.min(r.n, r.max));
  let o = 0;
  for (const c of r.chunks) {
    const n = Math.min(c.length, x.length - o);
    x.set(c.subarray(0, n), o);
    o += n;
  }
  const raw = Float64Array.from(resample(x, r.ctx.sampleRate, SMP.RATE));
  const d = smpDraft[r.k];
  let pk = 0;
  for (const v of raw) pk = Math.max(pk, Math.abs(v));
  if (pk < 1e-4) {                                  /* nothing came in: a muted or wrong input */
    sayK("recSilent");
    renderSamples();
    return;
  }
  if (raw.length > 1 && d.files.length < SMP.MAX_ZONES) {
    const [a, b] = autoTrim(raw);
    d.files.push({ fname: `REC ${d.files.length + 1}`, raw, a, b, s: takeSample(raw, a, b), root: 60 });
    if (!d.name) d.name = "REC";
  }
  renderSamples();
}

/* ---- trimming: the waveform of raw with its two ends, dragged with a pointer; the wheel zooms
 * (at the pointer); zoomed in, a drag away from the ends (or shift + wheel) moves the view; a double
 * click shows it all. The view, [v0, v1)
 * of raw, is kept in the file (the list is drawn again after every trim). */
function drawTrim(cv, f) {
  const w = cv.width, h = cv.height - 4, g = cv.getContext("2d"), cs = getComputedStyle(cv);
  const fg = cs.getPropertyValue("--fg").trim() || "#000", line = cs.getPropertyValue("--line").trim() || "#ccc";
  const n = f.raw.length, v0 = f.v0 ?? 0, v1 = f.v1 ?? n, span = v1 - v0;
  const xa = (f.a - v0) / span * w, xb = (f.b - v0) / span * w;
  if (f.pk === undefined) {                        /* raw never changes: its peak, once */
    f.pk = 1e-9;
    for (const v of f.raw) f.pk = Math.max(f.pk, Math.abs(v));
  }
  const pk = f.pk;
  g.clearRect(0, 0, w, cv.height);
  for (let x = 0; x < w; x++) {                     /* per column: the smallest and largest sample */
    const i0 = v0 + Math.floor(x / w * span), i1 = Math.max(i0 + 1, v0 + Math.floor((x + 1) / w * span));
    let lo = 0, hi = 0;
    for (let i = i0; i < i1 && i < n; i++) { lo = Math.min(lo, f.raw[i]); hi = Math.max(hi, f.raw[i]); }
    g.fillStyle = x >= xa && x < xb ? fg : line;
    g.fillRect(x, h / 2 - hi / pk * (h / 2 - 2), 1, Math.max(1, (hi - lo) / pk * (h / 2 - 2)));
  }
  g.fillStyle = fg;
  if (xa >= 0 && xa <= w) g.fillRect(Math.min(w - 2, xa), 0, 2, h);
  if (xb >= 0 && xb <= w) g.fillRect(Math.max(0, xb - 2), 0, 2, h);
  g.fillStyle = line;                               /* where the view is in the whole */
  g.fillRect(0, cv.height - 2, w, 2);
  g.fillStyle = fg;
  g.fillRect(v0 / n * w, cv.height - 3, Math.max(3, span / n * w), 3);

function trimCanvas(f) {
  const cv = el("canvas", { class: "trim", width: 600, height: 60, title: t("trim") });
  let end = null;                                   /* "a" or "b": the end being dragged */
  const frac = (e) => { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const at = (e) => {
    const v0 = f.v0 ?? 0, v1 = f.v1 ?? f.raw.length;
    return Math.round(v0 + frac(e) * (v1 - v0));
  };
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const v = [f.v0 ?? 0, f.v1 ?? f.raw.length];
    const d = e.deltaY || e.deltaX;
    if (!d) return;
    [f.v0, f.v1] = e.shiftKey || (!e.deltaY && e.deltaX)
      ? zoomView(f.raw.length, v[0], v[1], frac(e), 1, (d > 0 ? 0.1 : -0.1))
      : zoomView(f.raw.length, v[0], v[1], frac(e), d > 0 ? 1.25 : 0.8, 0);
    drawTrim(cv, f);
  }, { passive: false });
  cv.addEventListener("dblclick", () => { f.v0 = 0; f.v1 = f.raw.length; drawTrim(cv, f); });

   * the nearer end (the whole input shown: nothing to scroll) */
  const GRAB = 10;
  let pan = null;                                   /* dragging the view: { x, v0, span } */
  const zoomed = () => (f.v1 ?? f.raw.length) - (f.v0 ?? 0) < f.raw.length;
  const near = (e) => {                             /* the end within GRAB px of the pointer, or null */
    const r = cv.getBoundingClientRect(), v0 = f.v0 ?? 0, span = (f.v1 ?? f.raw.length) - v0;
    const da = Math.abs(e.clientX - (r.left + (f.a - v0) / span * r.width));
    const db = Math.abs(e.clientX - (r.left + (f.b - v0) / span * r.width));
    return Math.min(da, db) > GRAB ? null : da <= db ? "a" : "b";
  };
  cv.addEventListener("pointerdown", (e) => {
    if (smpBusy || recActive() || e.button !== 0 || !e.isPrimary || end || pan) return;   /* one primary pointer */
    const p = at(e);
    end = near(e);
    if (!end && zoomed()) {
      pan = { x: e.clientX, v0: f.v0 ?? 0, span: (f.v1 ?? f.raw.length) - (f.v0 ?? 0) };
      cv.style.cursor = "grabbing";
      cv.setPointerCapture(e.pointerId);
      return;
    }
    end = end || (Math.abs(p - f.a) <= Math.abs(p - f.b) ? "a" : "b");
    cv.setPointerCapture(e.pointerId);
    cv.dispatchEvent(new PointerEvent("pointermove", e));
  });

    if (pan) {

      f.v0 = Math.max(0, Math.min(f.raw.length - pan.span, a));
      f.v1 = f.v0 + pan.span;

      return;

    if (!end) {                                     /* hovering: what a press would do */

      return;

    else f.b = Math.min(f.raw.length, Math.max(p, f.a + min));
    drawTrim(cv, f);
  });
  const done = () => {
    if (pan) {                                      /* the view moved: nothing else changes */
      pan = null;
      cv.style.cursor = "grab";
      return;
    }
    if (!end) return;
    end = null;
    f.s = takeSample(f.raw, f.a, f.b);
    renderSamples();                                /* the length and the slot size change */
  };
  cv.addEventListener("pointerup", done);
  cv.addEventListener("pointercancel", done);
  requestAnimationFrame(() => drawTrim(cv, f));     /* (once it is in the page: its colours) */
  return cv;
}

/* leaving the Samples tab or disconnecting: a recording is stopped (it stays in the draft), the

function samplesLeave() {

/* play the trimmed sample as it will be stored (22050 Hz) */
let previewSrc = null, previewCtx = null;

  try {
    if (previewSrc) previewSrc.stop();

    for (let i = 0; i < f.s.length; i++) ch[i] = f.s[i] / 32768;

    }
    blk.addEventListener("dragover", (e) => { e.preventDefault(); blk.classList.add("over"); });
    blk.addEventListener("dragleave", () => blk.classList.remove("over"));
    blk.addEventListener("drop", (e) => {
      e.preventDefault();
      blk.classList.remove("over");
      if (!smpBusy && !recActive() && e.dataTransfer.files.length) addFiles(k, [...e.dataTransfer.files]);   /* (the recording sized itself to the slot) */
    });
    return blk;
  }));
}

async function smpInfo(d = dev) { d.smp = parse[CMD.SMP_INFO](await sessionRequest(d, req.smpInfo())); }

async function smpUpload(k, prog) {
  const d = smpDraft[k];
  let built;
  try { built = buildSlot(d.name, d.files.map((f) => ({ s: f.s, root: f.root }))); }
  catch (e) { sayK("smpFail", e.message); return; }
  if (!confirm(t("confirmUpload").replace("{n}", k + 1))) return;
  const { hdr, data } = built;
  const session = dev;
  const releaseBusy = beginBusy();
  smpBusy = true;
  renderSamples();
  prog = $("smpslots").querySelector(`[data-k="${k}"] progress[max="1"]`);
  prog.hidden = false;
  try {
    const t0 = performance.now();
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new Error("begin rc " + r.rc);
    for (let off = 0; off < data.length; off += 256) {
      const a = SMP.DATA_OFF + off;
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, a, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new Error(`write at 0x${a.toString(16)} rc ${w.rc}`);
      prog.value = (off + 256) / data.length;
      sayK("smpUploading", `${k + 1}  ${kib(Math.min(data.length, off + 256))} / ${kib(data.length)} KiB`);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, hdr), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new Error(`end rc ${r.rc} (${SMP_RC[r.rc] || "?"})`);
    sayK("smpDone", `${k + 1}  ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (session === dev) await smpInfo(session); } catch (e) { /* shown by the next action */ }
    smpBusy = false;
    releaseBusy();
    renderSamples();
  }
}

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  const session = dev;
  const releaseBusy = beginBusy();
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (session === dev) await smpInfo(session); } catch (e) { /* ignore */ }
    smpBusy = false;
    releaseBusy();
    renderSamples();
  }
}

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).
   Read on connect, after every RELOAD / sound change, with the slow safety DUMP and when the tab opens.
   The selected track's level / pan / mute are also Sound parameters: both views follow each other. */
let mixDrag = null;                 /* "lv:i" / "pan:i" while a strip control is dragged */
const mixEdit = new Map();          /* "lv:i" / "pan:i" -> time of the user's last change */
const mixCtl = [];                  /* per track: the strip's elements */
let panning = false;                /* v3 firmware: another track is selected for a moment (pan of a track that is not selected) */
const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600
  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))
  || (kind === "pan" && (panWant.has(i) || (!!dev && dev.link.hasQueued("pan:" + i))));
function trackName(x) {
  return [dev.info.engines[x.engine], (dev.names[x.engine] || [])[x.preset]].filter(Boolean).join(" ");
}

async function readMixer(d = dev) {
  assertSession(d);
  if (!d || !hasTracks()) return;
  const m = await mixer.read((r, o) => sessionRequest(d, r, o), d.info, { pan: pPan() });
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;
  });
  d.mix = m;
  if (m.sel !== d.sel && !panning) { d.sel = m.sel; needReload = true; }   /* selected on the device, push missed */
  renderMixer();
}

/* the Sound view's values of the selected track -> the strips */
function mixFromDump() {
  if (!dev || !dev.mix || !dev.dump || panning) return;
  const m = dev.mix, x = m.tracks[dev.sel];
  if (x) {
    if (!mixTouched("lv", dev.sel)) {
      x.level = dev.dump.p[P.LEVEL];
      x.mute = dev.dump.p[pMute()] ? 1 : 0;
    }
    if (!mixTouched("pan", dev.sel)) x.pan = dev.dump.p[pPan()];
  }
  if (mixCtl.length === m.ntrk) m.tracks.forEach((_, i) => updateStrip(i));
}
/* a strip's values -> the Sound view (the selected track) */
function mixToSound(i) {
  const x = dev.mix.tracks[i];
  const put = (s, id, v) => { if (v == null) return; (s ? dev.dump.g : dev.dump.p)[id] = v; showValue(key(s, id), v, false); };
  if (i !== dev.sel) return;
  put(0, P.LEVEL, x.level);
  put(0, pMute(), x.mute ? 1 : 0);
  put(0, pPan(), x.pan);
}

function renderMixer() {
  const box = $("mixer");
  if (!dev || !dev.mix) { box.replaceChildren(); mixCtl.length = 0; return; }
  const m = dev.mix;
  if (mixCtl.length !== m.ntrk || box.dataset.lang !== lang) {
    box.dataset.lang = lang;
    mixCtl.length = 0;
    box.replaceChildren(...m.tracks.map((_, i) => buildStrip(i)));
  }
  m.tracks.forEach((_, i) => updateStrip(i));
}
function buildStrip(i) {
  const lvDesc = dev.pdesc[P.LEVEL] || { fmt: F.INT, min: 0, max: 127, def: 100 };
  const pDesc = dev.pdesc[pPan()] || { fmt: F.BIPCT, min: -64, max: 63, def: 0 };
  const fader = el("input", { type: "range", class: "fader", min: 0, max: 127, step: 1, "aria-label": `${t("level")} ${i + 1}` });
  fader.addEventListener("pointerdown", () => { mixDrag = "lv:" + i; });
  fader.addEventListener("input", () => setLevel(i, +fader.value));
  fader.addEventListener("change", () => setLevel(i, +fader.value));
  fader.addEventListener("dblclick", () => setLevel(i, Math.max(0, Math.min(127, lvDesc.def))));
  const pan = el("input", { type: "range", class: "pan", min: pDesc.min, max: pDesc.max, step: 1, "aria-label": `${t("pan")} ${i + 1}` });
  pan.addEventListener("pointerdown", () => { mixDrag = "pan:" + i; });
  pan.addEventListener("input", () => setPan(i, +pan.value, false));
  pan.addEventListener("change", () => setPan(i, +pan.value, true));
  pan.addEventListener("dblclick", () => setPan(i, pDesc.def, true));
  const c = {
    lvDesc, pDesc, fader, pan,
    num: el("button", { type: "button", class: "tog num", title: t("selectTrack"), onclick: () => selectTrack(i) }, String(i + 1)),
    snd: el("div", { class: "snd" }),
    rec: el("span", { class: "rec", ic: "control_rec_f", title: t("rec") }, t("rec")),
    lvOut: el("span", { class: "v lv" }),
    mute: el("button", { type: "button", class: "tog", ic: "control_speaker_mute", onclick: () => setMute(i, !dev.mix.tracks[i].mute) }, t("mute")),
    panOut: el("span", { class: "v" }),
    selb: el("button", { type: "button", class: "selb", onclick: () => selectTrack(i) }),
  };
  c.strip = el("div", { class: "strip", role: "group", "aria-label": `${t("track")} ${i + 1}` },
    c.num, c.snd, c.rec, fader, c.lvOut, c.mute, el("span", { class: "v dim", ic: "symbol_pan" }, t("pan")), pan, c.panOut, c.selb);
  mixCtl[i] = c;
  return c.strip;
}
function updateStrip(i) {
  const c = mixCtl[i], x = dev && dev.mix && dev.mix.tracks[i];
  if (!c || !x) return;
  const sel = i === dev.sel;
  c.strip.classList.toggle("sel", sel);
  c.num.setAttribute("aria-pressed", sel ? "true" : "false");
  const nm = trackName(x);
  c.snd.textContent = nm;
  c.snd.title = nm;
  if (!mixTouched("lv", i)) c.fader.value = String(x.level);
  const [lt, lu] = fmtValue(c.lvDesc, x.level);
  c.lvOut.textContent = lu ? `${lt} ${lu}` : lt;
  c.mute.setAttribute("aria-pressed", x.mute ? "true" : "false");
  c.strip.classList.toggle("muted", !!x.mute || !x.level);
  c.pan.disabled = x.pan == null;
  if (x.pan != null) {
    if (!mixTouched("pan", i)) c.pan.value = String(x.pan);
    const [pt, pu] = fmtValue(c.pDesc, x.pan);
    c.panOut.textContent = pu ? `${pt} ${pu}` : pt;
  }
  c.rec.classList.toggle("on", !!x.armed);
  c.selb.disabled = sel;
  c.selb.textContent = t(sel ? "selectedTrack" : "selectTrack");
}
window.addEventListener("pointerup", () => { mixDrag = null; });
window.addEventListener("pointercancel", () => { mixDrag = null; });

/* level and mute: TRACK_MIX, one in flight per track and one queued with the latest values (as SET) */
function setLevel(i, v) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].level = v;
  mixEdit.set("lv:" + i, performance.now());
  updateStrip(i);
  mixToSound(i);
  sendMix(i);
}
function setMute(i, on) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].mute = on ? 1 : 0;
  mixEdit.set("lv:" + i, performance.now());
  updateStrip(i);
  mixToSound(i);
  sendMix(i);
}
async function sendMix(i) {
  const d = dev, x = d.mix.tracks[i];
  try {
    const r = await mixer.setMix(rq, i, x.level, x.mute, { key: "mix:" + i });
    if (d !== dev || !d.mix || mixDrag === "lv:" + i || d.link.hasQueued("mix:" + i)) return;
    const y = d.mix.tracks[i];                      /* the device's values after clamping */
    y.level = r.level; y.mute = r.mute;
    updateStrip(i);
    mixToSound(i);
  } catch (e) { report(e); }
}
/* pan: the selected track as any Sound parameter; another track with TRACK_PARAM (v4: while dragging, one in
   flight and one queued with the latest value), or with v3 firmware on release (it is selected for a moment) */
const panWant = new Map();
function setPan(i, v, final) {
  if (!dev || !dev.mix) return;
  dev.mix.tracks[i].pan = v;
  mixEdit.set("pan:" + i, performance.now());
  updateStrip(i);
  if (i === dev.sel) { userSet(0, pPan(), v, final); return; }
  if (dev.v4) panTrack(i, v);
  else if (final) panOther(i, v);
}
async function panTrack(i, v) {
  const d = dev;
  try {
    const r = await mixer.setPan(rq, i, d.sel, pPan(), v, true);
    if (d !== dev || !d.mix || mixDrag === "pan:" + i || d.link.hasQueued("pan:" + i)) return;
    d.mix.tracks[i].pan = r;                        /* the device's value after clamping */
    updateStrip(i);
    if (i === d.sel) mixToSound(i);
  } catch (e) { report(e); }
}
async function panOther(i, v) {
  panWant.set(i, v);
  if (panOther.run) return;
  panOther.run = true;
  const d = dev;
  try {
    while (busy && d === dev) await sleep(20);      /* not in the middle of another multi-request operation */
    assertSession(d);
    const releaseBusy = beginBusy();
    panning = true;
    try {
      while (panWant.size && d === dev) {
        const [tr, val] = panWant.entries().next().value;
        panWant.delete(tr);
        const r = await mixer.setPan(rq, tr, d.sel, pPan(), val);
        if (d.mix && !panWant.has(tr)) { d.mix.tracks[tr].pan = r; updateStrip(tr); }
      }
    } finally { panning = false; releaseBusy(); }
  } catch (e) { report(e); } finally { panOther.run = false; panWant.clear(); }
}

/* ------------------------------------------------- live sync / polling --- */
/* With WATCH (protocol v2) the device pushes CHANGED / RELOAD / STEP_CHANGED; the editor PINGs about
   once a second so the watch stays on (it ends 3 s after the last request), and DUMPs every 5 s as a
   safety net. Older firmware: DUMP every 400 ms and two steps per round. */
function onPush(f) {
  const d = dev;
  if (!d || !d.dump || !d.info) return;
  try {
    if (f.cmd === CMD.CHANGED) {
      const c = parse[CMD.CHANGED](f.a);
      if (panning && !c.scope) return;              /* about the track selected for a moment, not ours */
      const arr = c.scope ? d.dump.g : d.dump.p;
      if (c.id >= arr.length) return;
      const k = key(c.scope, c.id);
      if (touched(k)) return;                       /* the user's value wins; their SET follows */
      const old = arr[c.id];
      arr[c.id] = c.value;
      showValue(k, c.value, false);
      blink(k);
      mixFromDump();
      if (!c.scope && c.id === pSlen() && old !== c.value) { $("steptables").dataset.len = ""; renderSteps(); }
    } else if (f.cmd === CMD.RELOAD) {
      d.sel = parse[CMD.RELOAD](f.a).track;          /* v3: another track may be selected on the device */
      if (selfReload.n > 0 && Date.now() < selfReload.until) { selfReload.n--; return; }
      needReload = true;
      maybeReload();
    } else if (f.cmd === CMD.STEP_CHANGED) {
      const { index } = parse[CMD.STEP_CHANGED](f.a);
      if (index < d.info.nstep) refreshStep(index);
    } else if (f.cmd === CMD.TRACK_CHANGED) {       /* v4: level / pan / mute of a track that is not selected */
      const c = parse[CMD.TRACK_CHANGED](f.a), x = d.mix && d.mix.tracks[c.track];
      if (!x || c.track === d.sel) return;
      if (c.id === pPan()) { if (!mixTouched("pan", c.track)) x.pan = c.value; }
      else if (c.id === pMute()) { if (!mixTouched("lv", c.track)) x.mute = c.value ? 1 : 0; }
      else if (c.id === P.LEVEL) { if (!mixTouched("lv", c.track)) x.level = c.value; }
      else return;
      updateStrip(c.track);
    }
  } catch (e) { console.warn("bad push", f, e); }
}
function blink(k) {
  const c = ctl.get(k);
  if (!c || !c.row) return;
  c.row.classList.add("pushed");
  clearTimeout(c.blink);
  c.blink = setTimeout(() => c.row.classList.remove("pushed"), 400);
}
async function refreshStep(i) {
  const d = dev;
  try {
    const s = parse[CMD.STEP_GET](await rq(req.stepGet(i), { key: "step:" + i }));
    if (d !== dev || s.index !== i) return;
    d.steps[i] = s;
    updateStepRows();
  } catch (err) { report(err); }
}
function maybeReload() {
  if (!dev || busy || !needReload || !dev.dump) return;
  op(() => afterSoundChange("reloaded"));
}
/* one multi-request operation; polling waits for it */
async function op(fn) {
  if (!dev) return;
  const releaseBusy = beginBusy();
  try { await fn(); } catch (err) { report(err); } finally { releaseBusy(); }
}
function renderLive() {
  $("live").textContent = !dev || !dev.dump ? "" : t(dev.watch ? "live" : "polling");
}

/* keep-alive: PING when nothing else went out for ~1 s; after a longer gap (hidden tab, a long flash
   write: Link.onGap) the watch may have ended: WATCH again and re-read what may have been missed */
let rewatch = false;
async function keepAlive() {
  const d = dev;
  if (!d || !d.watch || !d.dump || document.hidden) return;
  const gap = Date.now() - d.link.lastSent;
  if (rewatch || gap > 2500) {
    if (keepAlive.run) return;
    keepAlive.run = true;
    try {
      const on = await startWatch((r, o) => sessionRequest(d, r, o));
      assertSession(d);
      rewatch = false;                              /* (this WATCH itself may have flagged the gap) */
      if (on) { d.v4 = on === 3; needReload = true; maybeReload(); }
      else if (d === dev) { d.watch = false; renderLive(); }
    } catch (e) { /* closed */ } finally { keepAlive.run = false; }
  } else if (gap > 850 && d.link.idle) {
    d.link.request(req.ping(), { key: "ping", quiet: true, retries: 0 }).catch(() => {});
  }
}
setInterval(keepAlive, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && dev && dev.watch) { rewatch = true; keepAlive(); } });

let stepRR = 0;
setInterval(async () => {
  if (!dev || busy || dragging || document.hidden || !dev.dump || !dev.link.idle) return;
  if (needReload) { maybeReload(); return; }
  if (dev.watch && Date.now() - lastDump < 5000) return;
  const releaseBusy = beginBusy();
  const d = dev;
  try {
    const dump = await getDump();
    if (d !== dev) return;
    const soundChanged = dump.engine !== d.dump.engine || dump.preset !== d.dump.preset;
    const engineChanged = dump.engine !== d.dump.engine;
    const oldLen = d.dump.p[pSlen()];
    for (const [k, c] of ctl) {
      const v = c.scope ? dump.g[c.id] : dump.p[c.id];
      if (touched(k)) { (c.scope ? dump.g : dump.p)[c.id] = c.scope ? d.dump.g[c.id] : d.dump.p[c.id]; continue; }
      showValue(k, v, false);
    }
    d.dump = dump;
    if (engineChanged) await rereadEngineDesc();
    if (hasTracks()) await readMixer();             /* the strips (other tracks push nothing) */
    if (soundChanged) { updateBrowser(); await loadSteps(); sayK("ready"); return; }
    if (dump.p[pSlen()] !== oldLen) { $("steptables").dataset.len = ""; renderSteps(); }
    if (d.watch) return;                            /* steps come as STEP_CHANGED */
    /* steps are not in DUMP: follow them two at a time */
    const len = Math.max(1, Math.min(d.info.nstep, dump.p[pSlen()] || 16));
    for (let n = 0; n < 2; n++) {
      stepRR = (stepRR + 1) % len;
      if (performance.now() - (stepEdit.get(stepRR) || 0) < 1500) continue;
      const s = await getStep(stepRR);
      const o = d.steps[stepRR];
      d.steps[stepRR] = s;
      if (JSON.stringify(o) !== JSON.stringify(s)) updateStepRows();
    }
  } catch (err) { report(err); } finally { releaseBusy(); }
}, 400);

/* ------------------------------------------------ device preferences --- */
async function syncPreferences(d) {
  if (!d || !d.info || !d.info.uiCaps) { renderPreferences(); return; }
  const preferences = await readDevicePreferences((r, o) => sessionRequest(d, r, o), d.info, d.names, d.preferences);
  if (dev !== d) return;
  d.preferences = preferences;
  if (preferences.slots) { d.bank = preferences.slots; renderBank(); }
  renderPreferences();
}
function preferenceResult(rc) {
  if (rc === 4) sayK("devicePending");
  else if (rc === 3) sayK("deviceUnsaved");
  else if (rc) throw new Error(t("deviceRejected"));
}
async function changePreference(id, value) {
  const d = dev;
  if (!d) return;
  while (busy && d === dev) await sleep(20);
  if (d !== dev) return;
  await op(async () => {
    const result = parse[CMD.UI_SET](await sessionRequest(d, req.uiSet(id, value), FLASH_OPT));
    if (d !== dev) return;
    await syncPreferences(d); preferenceResult(result.rc);
  });
}
async function changeFavorite(row) {
  const d = dev;
  if (!d) return;
  while (busy && d === dev) await sleep(20);
  if (d !== dev) return;
  await op(async () => {
    const result = parse[CMD.FAV_SET](await sessionRequest(d, req.favSet(row.engine, row.preset, !row.favorite), FLASH_OPT));
    if (d !== dev) return;
    await syncPreferences(d); preferenceResult(result.rc);
  });
}
function renderPreferences(force = false) {
  const d = dev, p = d && d.preferences;
  $("device-display").hidden = !p || !(p.state.caps & 7);
  $("device-presets").hidden = !p || !(p.state.caps & 8);
  if (!p) { renderPreferences.sig = null; return; }
  const sig = JSON.stringify([p.state, p.palettes, lang, d.dump && d.dump.engine]);
  if (!force && sig === renderPreferences.sig) return;
  renderPreferences.sig = sig;
  const defs = [
    [0, "deviceTheme", p.palettes, p.state.palette],
    [1, "deviceFont", [t("deviceRegular"), t("deviceBold")], p.state.font],
    [2, "deviceMonitor", [t("deviceOff"), t("deviceEvents"), t("deviceNotes")], p.state.monitor],
  ];
  const controls = [];
  for (const [id, key, options, value] of defs) {
    if (!(p.state.caps & (1 << id))) continue;
    const select = el("select", { "aria-label": t(key) });
    select.replaceChildren(...options.map((text, i) => el("option", { value: i, text })));
    select.value = value;
    select.addEventListener("change", () => changePreference(id, +select.value));
    controls.push(el("label", { class: "bar" }, el("span", { text: t(key) }), select));
  }
  $("device-display-controls").replaceChildren(...controls);
  if (!(p.state.caps & 8)) return;
  const filter = $("device-filter");
  filter.setAttribute("aria-label", t("deviceList"));
  filter.replaceChildren(el("option", { value: 0, text: t("deviceAll") }), el("option", { value: 1, text: t("deviceFavorites") }));
  filter.value = p.state.filter;
  const rows = devicePresetRows(d.info, d.names, p);
  const table = el("table");
  table.append(el("colgroup", {}, el("col", { style: "width:40px" }), el("col"), el("col", { style: "width:110px" })));
  for (const row of rows) {
    const name = row.user ? slotName(row.preset) + " " + row.name : row.name;
    const star = el("button", { text: row.favorite ? "\u2605" : "\u2606", "aria-label": t(row.favorite ? "deviceUnstar" : "deviceStar") + ": " + name, "aria-pressed": String(row.favorite) });
    star.addEventListener("click", () => changeFavorite(row));
    const load = el("button", { text: name });
    load.addEventListener("click", () => { if (!dev || busy) return; row.user ? bankLoad(row.preset) : choosePreset(row.engine, row.preset); });
    table.append(el("tr", {}, el("td", {}, star), el("td", {}, load), el("td", { text: row.user ? t("bank") : d.info.engines[row.engine] })));
  }
  $("device-preset-list").replaceChildren(rows.length ? table : el("p", { class: "dim", text: t("deviceEmpty") }));
}

/* ----------------------------------------------------------- library --- */
/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("felucca-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

let lib = [];                  /* patches (cleanPatch + id) */
let libMeta = { keys: null, engines: null, pe0: null };
let libPersistent = false;
let libSel = null, bankSel = null;
let libBusy = false;           /* a library / bank operation is running */
const newId = () => (self.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const slotName = (i) => "U" + String(i + 1).padStart(2, "0");
const libCtx = () => (dev && dev.keys ? { keys: dev.keys, engines: dev.info.engines, firmware: dev.info.version, pe0: dev.info.pe0 }
  : { keys: libMeta.keys, engines: libMeta.engines, firmware: "", pe0: libMeta.pe0 });

async function libInit() {
  try {
    libPersistent = await store.ok();
    if (libPersistent) {
      lib = ((await store.all()) || []).filter((p) => p && p.id);
      libMeta = (await store.getMeta("layout")) || libMeta;
    }
  } catch (e) { console.warn(e); libPersistent = false; }
  renderLib();
}
async function libWrite(ps) {
  try { await store.putMany(ps); } catch (e) { console.warn(e); sayK("error", "IndexedDB: " + e.message); }
}
async function libAdd(patches) {
  const add = patches.map((p) => ({ ...cleanPatch(p), id: newId() }));
  lib.push(...add);
  if (add.length) libSel = add[add.length - 1].id;
  await libWrite(add);
  renderLib();
  return add;
}
async function libUpdate(p) {
  p.modified = nowIso();
  await libWrite([p]);
  renderLib();
}
/* the device's parameter layout becomes the library's; patches stored with another layout are mapped by key.
   A device without DIGITAL (engine 1 "-", retired in 1.0): the library's DIGITAL sounds become FM6 (fromDigital,
   as readLibraryFile does), also when the layout itself is unchanged */
async function libAdopt(d) {
  const keys = d.keys, engines = d.info.engines, changed = [];
  const relayout = (libMeta.keys && !sameKeys(libMeta.keys, keys)) || (libMeta.engines && !sameKeys(libMeta.engines, engines));
  const noFm4 = (engines || [])[1] === "-";
  for (const p of lib) {
    const name = p.engineName || (libMeta.engines || [])[p.engine];
    const digital = noFm4 && !p.fm6 && (name === "DIGITAL" || ((!name || name === "-") && p.engine === 1));
    if (!relayout && !digital) continue;
    if (relayout) p.p = remapParams(p.p, libMeta.keys, keys);
    const pt = digital ? fromDigital(p, engines, keys && p.p.length === keys.length ? d.info.pe0 : p.p.length - 8) : null;
    if (pt) Object.assign(p, cleanPatch(pt));
    else {
      const e = name ? engines.indexOf(name) : p.engine;
      if (e >= 0) { p.engine = e; p.engineName = engines[e]; }
    }
    changed.push(p);
  }
  libMeta = { keys, engines, pe0: d.info.pe0 };
  if (changed.length) await libWrite(changed);
  try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
  renderLib();
}
const engineOk = (p) => !!dev && p.engine < dev.info.nengines && (!p.engineName || dev.info.engines[p.engine] === p.engineName);
/* a full parameter set for UP_PUT: unknown values get the DESC default where it is known, else 0 */
function fullParams(p) {
  const out = [];
  for (let i = 0; i < dev.info.pcount; i++) {
    let v = p.p[i];
    if (v == null) {
      const d = dev.pdesc[i];
      v = d && (i < dev.info.pe0 || p.engine === dev.dump.engine) ? d.def : 0;
    }
    out.push(v);
  }
  return out;
}

/* library operations that talk to the device: one at a time, buttons off meanwhile */
async function libOp(fn) {
  if (!dev || libBusy) return;
  const d = dev;
  libBusy = true;
  const releaseBusy = beginBusy();
  renderLib(); renderBank();
  try { await fn(d, (r, o) => sessionRequest(d, r, o)); } catch (err) { report(err); } finally { releaseBusy(); libBusy = false; renderLib(); renderBank(); }
}

  if (d.bank && r.slots[0]) d.bank.slots[slot] = r.slots[0];
}

function bankGet(slot) {

    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    const pt = { name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, grid: u.grid, tags: ["device"] };
    await libAdd([reservedFm4(dev.info.engines, u.engine) ? fromDigital(pt, dev.info.engines, dev.info.pe0) : pt]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot, d);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async (d, rqf) => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async (d, rqf) => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, p: u.p, pattern: u.pattern, grid: u.grid, slot: x.slot,
      engineName: reservedFm4(dev.info.engines, u.engine) ? "DIGITAL" : dev.info.engines[u.engine] });   /* (DIGITAL's values) */
  }
  download(`felucca-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

/* ------------------------------------------------------------------ FM6 --- */
/* The 6-OP FM tab (firmware with FM6: INFO's fm6 tag): the whole patch of an FM6 track, which the device
   only reaches through its macros. Read a track's patch or a slot, edit it, send it to a track (live while
   editing), store it in the bank (B1..B32), import the generic 155-byte single-voice and 4096-byte 32-voice
   SysEx files, export them. */
let fm6v = FM6.init();                 /* the patch being edited (155 bytes) */
let fm6Imported = [];                  /* voices of the last imported file: [{name, v}] */
let fm6List = null;                    /* FM6_LIST of the device */
let fm6Timer = null;
const fm6Ok = () => !!dev && !!dev.info && !!dev.info.fm6;
const fm6Track = () => +$("fm6trk").value || 0;
const fm6SlotName = (i) => (i < dev.info.fm6.factory ? "F" : "B") + (i < dev.info.fm6.factory ? i + 1 : i - dev.info.fm6.factory + 1);
const FM6_WAVES = ["TRI", "SAW-", "SAW+", "SQR", "SIN", "S&H"];
const FM6_CURVES = ["-LIN", "-EXP", "+EXP", "+LIN"];
function fm6Set(i, val) {
  fm6v[i] = Math.max(0, Math.min(FM6.max(i), Math.round(+val || 0)));
  if ($("fm6live").checked && fm6Ok()) {
    clearTimeout(fm6Timer);
    fm6Timer = setTimeout(() => op(() => fm6Send(true)), 150);
  }
}
function fm6Num(i, title) {
  return el("input", { type: "number", min: 0, max: FM6.max(i), value: fm6v[i], title, class: "fm6n",
    onchange: (e) => { fm6Set(i, e.target.value); e.target.value = fm6v[i]; renderFm6Ops(); } });
}
function fm6Sel(i, names, title) {
  const s = el("select", { title, onchange: (e) => { fm6Set(i, e.target.value); renderFm6(); } },
    ...names.map((n, k) => el("option", { value: k, text: n })));
  s.value = fm6v[i];
  return s;
}
function renderFm6Voice() {
  const V = FM6.VI, alg = fm6v[V.ALG], fb = FM6.feedbackOp(alg);
  const nm = el("input", { type: "text", maxlength: 10, value: FM6.name(fm6v), size: 11,
    onchange: (e) => { FM6.setName(fm6v, e.target.value); fm6Set(0, fm6v[0]); e.target.value = FM6.name(fm6v); } });
  const row = (label, ...kids) => el("tr", {}, el("th", { text: label }), el("td", {}, ...kids));
  $("fm6voice").replaceChildren(el("table", {},
    row(t("name"), nm),
    row("ALG", fm6Sel(V.ALG, Array.from({ length: 32 }, (_, k) => String(k + 1)), "ALG"),
      el("span", { class: "dim", text: ` ${t("fm6Carriers")} ${FM6.carriers(alg).join(" ")}, ${t("fm6Feedback")} OP${fb}` })),
    row("FB", fm6Num(V.FB, "FB"), " OKS ", fm6Num(V.OKS, "OKS"), " TRNSP ", fm6Num(V.TRNSP, "TRNSP")),
    row("LFO", fm6Sel(V.LFW, FM6_WAVES, "WAVE"), " SPD ", fm6Num(V.LFS, "SPEED"), " DLY ", fm6Num(V.LFD, "DELAY"),
      " PMD ", fm6Num(V.LPMD, "PMD"), " AMD ", fm6Num(V.LAMD, "AMD"), " PMS ", fm6Num(V.LPMS, "PMS"), " SYNC ", fm6Num(V.LKS, "SYNC")),
    row(t("fm6PitchEg"), "R ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PR1 + k, "R" + (k + 1))),
      " L ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PL1 + k, "L" + (k + 1))))));
}
function renderFm6Ops() {
  const car = FM6.carriers(fm6v[FM6.VI.ALG]);
  const head = el("tr", {}, el("th", { text: "OP" }), ...FM6.OP.map(([n]) => el("th", { text: n })), el("th", { text: t("fm6Freq") }));
  const rows = [1, 2, 3, 4, 5, 6].map((n) => el("tr", {},
    el("th", { text: (car.includes(n) ? "● " : "") + n }),
    ...FM6.OP.map(([f]) => el("td", {}, f === "LC" || f === "RC" ? fm6Sel(FM6.at(n, f), FM6_CURVES, f)
      : f === "MODE" ? fm6Sel(FM6.at(n, f), ["RATIO", "FIXED"], f) : fm6Num(FM6.at(n, f), `OP${n} ${f}`))),
    el("td", { class: "dim", text: FM6.freqText(fm6v, n) })));
  $("fm6ops").replaceChildren(el("div", { class: "fm6ops" }, el("table", {}, head, ...rows)), el("p", { class: "dim", text: t("fm6Legend") }));
}
function renderFm6Imported() {
  const box = $("fm6imported");
  if (!fm6Imported.length) { box.replaceChildren(); return; }
  box.replaceChildren(el("p", { class: "dim", text: t("fm6Pick") }),
    el("p", { class: "bar" }, ...fm6Imported.map((x, k) => el("button", { text: `${k + 1} ${x.name}`,
      onclick: () => { fm6v = Uint8Array.from(x.v); renderFm6(); sayK("fm6Picked", ` ${x.name}`); } }))));
}
function renderFm6() {
  if (!fm6Ok()) return;
  const ts = $("fm6trk"), keepT = ts.value, ss = $("fm6slot"), keepS = ss.value;
  ts.replaceChildren(...Array.from({ length: dev.info.ntrk || 1 }, (_, i) => el("option", { value: i, text: String(i + 1) })));
  ts.value = keepT || (dev.sel ?? 0);
  const n = dev.info.fm6.factory + dev.info.fm6.bank;
  ss.replaceChildren(...Array.from({ length: n }, (_, i) => {
    const s = fm6List && fm6List.slots[i];
    return el("option", { value: i, text: `${fm6SlotName(i)} ${s && s.used ? s.name : t("empty")}` });
  }));
  if (keepS) ss.value = keepS;
  renderFm6Voice();
  renderFm6Ops();
  renderFm6Imported();
}
async function fm6Refresh(d = dev) {
  fm6List = parse[CMD.FM6_LIST](await sessionRequest(d, req.fm6List()));
  renderFm6();
}
async function fm6Send(quiet) {
  const r = parse[CMD.FM6_PUT](await sessionRequest(dev, req.fm6Put(FM6.TARGET.TRACK, fm6Track(), FM6.pack(fm6v))));
  checkRc(r.rc);
  if (!quiet) sayK("fm6Sent", ` ${fm6Track() + 1}`);
}
$("fm6read").addEventListener("click", () => op(async () => {
  const r = parse[CMD.FM6_GET](await sessionRequest(dev, req.fm6Get(FM6.TARGET.TRACK, fm6Track())));
  checkRc(r.rc);
  fm6v = FM6.unpack(r.packed);
  renderFm6();
  sayK("fm6Read", ` ${fm6Track() + 1}: ${FM6.name(fm6v)}`);
}));
$("fm6send").addEventListener("click", () => op(() => fm6Send(false)));
$("fm6load").addEventListener("click", () => op(async () => {
  const i = +$("fm6slot").value, nf = dev.info.fm6.factory;
  const r = parse[CMD.FM6_GET](await sessionRequest(dev, i < nf ? req.fm6Get(FM6.TARGET.FACTORY, i) : req.fm6Get(FM6.TARGET.BANK, i - nf)));
  if (r.rc === 2) { sayK("emptySlot", fm6SlotName(i)); return; }
  checkRc(r.rc);
  fm6v = FM6.unpack(r.packed);
  renderFm6();
  sayK("fm6Loaded", ` ${fm6SlotName(i)}: ${FM6.name(fm6v)}`);
}));
$("fm6store").addEventListener("click", () => {
  const i = +$("fm6slot").value, nf = dev ? dev.info.fm6.factory : 0;
  if (!fm6Ok()) return;
  if (i < nf) { sayK("fm6Factory"); return; }
  const s = fm6List && fm6List.slots[i];
  if (s && s.used && !confirm(t("confirmOverwrite").replace("{n}", fm6SlotName(i)).replace("{name}", s.name))) return;
  op(async () => {
    checkRc(parse[CMD.FM6_PUT](await sessionRequest(dev, req.fm6Put(FM6.TARGET.BANK, i - nf, FM6.pack(fm6v)))).rc);
    await fm6Refresh();
    sayK("storedSlot", fm6SlotName(i));
  });
});
$("fm6erase").addEventListener("click", () => {
  const i = +$("fm6slot").value, nf = dev ? dev.info.fm6.factory : 0;
  if (!fm6Ok()) return;
  const s = fm6List && fm6List.slots[i];
  if (i < nf || !s || !s.used || !confirm(t("confirmEraseSlot").replace("{n}", fm6SlotName(i)).replace("{name}", s.name))) return;
  op(async () => {
    checkRc(parse[CMD.FM6_ERASE](await sessionRequest(dev, req.fm6Erase(i - nf))).rc);
    await fm6Refresh();
    sayK("erasedSlot", fm6SlotName(i));
  });
});
$("fm6init").addEventListener("click", () => { fm6v = FM6.init(); renderFm6(); });
$("fm6import").addEventListener("click", () => $("fm6file").click());
$("fm6file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = FM6.parseSysex(new Uint8Array(await f.arrayBuffer()));
  if (!r.voices.length) { sayK("badfile", f.name); return; }
  fm6Imported = r.voices;
  if (r.voices.length === 1) fm6v = Uint8Array.from(r.voices[0].v);
  renderFm6();
  sayK("imported", `${f.name}: ${r.voices.length}` + (r.badSum ? ` (${t("fm6BadSum")})` : ""));
});
function downloadBytes(name, bytes) {
  const a = el("a", { href: URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" })), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("fm6export").addEventListener("click", () => downloadBytes(`${fileSlug(FM6.name(fm6v))}.syx`, FM6.singleSysex(fm6v)));
$("fm6bankexp").addEventListener("click", () => op(async () => {
  const out = [];
  for (let k = 0; k < dev.info.fm6.bank; k++) {
    const r = parse[CMD.FM6_GET](await sessionRequest(dev, req.fm6Get(FM6.TARGET.BANK, k)));
    out.push(r.rc ? null : FM6.unpack(r.packed));
  }
  downloadBytes(`felucca-fm6-bank-${today()}.syx`, FM6.bankSysex(out));
  sayK("fm6Exported");
}));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
</body>
