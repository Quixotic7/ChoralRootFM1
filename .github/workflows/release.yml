# SPDX-License-Identifier: GPL-3.0-only
# Build, sign and release the ChoralRoot FM-1 packages from a tag (BUILDING.md "Releasing"): the standard one and the
# single-core one (choralroot-X.Y-1core.fwsc, docs/DUALCORE.md "Two packages"), both from one ./build.sh --release.
# The build runs in The Firmware Hub's shared workflow zvenson/fm1-build at its reviewed tag v1, which signs a GitHub
# build attestation for every package and app: the hub then shows "Built from source on GitHub" on ChoralRoot's card,
# and anyone can check a file with gh attestation verify (BUILDING.md "Checking a package").
#   push of a tag vX.Y  -> draft:   a draft release vX.Y (the notes, LICENSE, LICENSING.md, LICENSES.zip): nothing
#                                   public yet
#                          build:   fm1-build@v1 runs tools/hub_build.sh (./build.sh --release; every sha256 checked
#                                   against web/releases.json before anything is signed), attests choralroot-* (the
#                                   two packages and their apps) and uploads them with its SHA256SUMS to the draft
#                          publish: the draft's files checked (signed by fm1-build v1 at its reviewed commit for
#                                   this tag and commit, SHA256SUMS, web/releases.json), the release published, then
#                                   pages.yml
#   workflow_dispatch   -> build only: fm1-build signs the build of the branch, no release; the packages are the
#                          run's artifact "packages"
# An SMK-37 build (SMK37.md) has a version that ends in -smk37 (tag vX.Y[-suffix]-smk37, e.g. v0.24-beta2-smk37;
# -smk37.N for a respin of the SMK build on the same FM-1 base, e.g. v0.24-beta3-smk37.1):
# the three models (BOARD=smk37 MODEL=pro|elite|mke ./build.sh --release X.Y-smk37) and their single-core twins,
# signed the same way and checked against web/releases-smk37.json when it lists the version, a full release that is
# never GitHub's "latest" (the FM-1's stays it; a pre-release only on an FM-1 base that is a beta or an rc), and the
# site rebuilt from that tag for the FM-1's current version (web/releases.json's first entry, unchanged) so
# that the SMK-37 test installer (webapp/smk37/) offers the new build; only when web/releases-smk37.json lists it.
# The signed files are never rebuilt, replaced or uploaded by hand afterwards: the hub compares each package's SHA-256
# with the signed one, and the installer with web/releases.json's.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1 (X.Y, X.Y.Z or X.Y-suffix; X.Y[-suffix]-smk37: the SMK-37 test build). Builds and signs an artifact; no release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # the shared workflow the hub trusts, at refs/tags/v1, and v1's digest as the attestation records it (the
  # certificate's Build Signer Digest): v1 is an annotated tag, so this is the tag object 5ba8c359.., which names
  # the commit 85a003ab.. (2026-10-18, its CHANGELOG), not that commit (HISTORY 3y191). publish refuses a package
  # signed by any other v1 (a moved or re-made tag)
  FM1_BUILD: zvenson/fm1-build/.github/workflows/build.yml
  FM1_BUILD_V1_SHA: 5ba8c359b1744cc53c4530b15eff52d0d5c1255b

jobs:
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write                 # the draft release and its licence files
    outputs:
      version: ${{ steps.version.outputs.version }}
      board: ${{ steps.version.outputs.board }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docs/releases
            web/releases.json
            web/releases-smk37.json
            tools/hub_build.sh
            LICENSE
            LICENSING.md
            LICENSES
            SMK37.md
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        run: tools/hub_build.sh --version | tee -a "$GITHUB_OUTPUT"

      - name: A published release is never rebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # a rerun may refill the draft; a public release keeps the signed files it has (delete it to redo)
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::the release $GITHUB_REF_NAME is published: its signed packages stay as they are"
              exit 1
            fi
          fi

      - name: An FM-1 release that publishes the site is web/releases.json's first entry
        # (pages.yml refuses it otherwise; checked here, before anything is built or public)
        if: ${{ steps.version.outputs.board == 'fm1' && (!contains(steps.version.outputs.version, '-') || contains(steps.version.outputs.version, '-beta')) }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          first=$(python3 -c 'import json; print(json.load(open("web/releases.json"))["releases"][0]["version"])')
          if [ "$first" != "$VERSION" ]; then
            echo "::error::web/releases.json starts with $first, not $VERSION: add $VERSION first (its date, tag, bullets and the two packages' sha256s: BUILDING.md \"Releasing\") and tag that commit"
            exit 1
          fi

      - name: Release notes (docs/releases/<version>.md, then the install text)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REL_BOARD: ${{ steps.version.outputs.board }}
        run: |
          set -euo pipefail
          if [ "$REL_BOARD" = smk37 ]; then
            {
              if [ -f "docs/releases/$VERSION.md" ]; then cat "docs/releases/$VERSION.md"; echo; echo "---"; echo; fi
              sed -e "s/@VERSION@/$VERSION/g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" <<'EOT'
          ChoralRoot @VERSION@ for the M-Vave SMK-37 Pro, SMK-37 Elite and MKE-P37 (and the Starrykey 37 Play, which takes the Pro's package). Tested on SMK-37s by their owners (the maintainer has none); genkigenki's port (https://github.com/genkigenki/fm1-to-smk37). Read SMK37.md first.

          One package per model: `choralroot-@VERSION@.fwsc` (SMK-37 Pro, Starrykey 37 Play), `-elite`, `-mke`; each has a `-1core` twin for a keyboard that crashes or freezes with the standard one. Install with the SMK-37 web installer (SMK37.md, Install) or `python3 tools/fm1_install.py FILE`. The way back: M-VAVE's package for your model with M-UPGRADE.

          `SHA256SUMS` lists every package and app; GitHub built and signed each from this tag's source (The Firmware Hub's shared workflow): `gh attestation verify FILE --repo @REPO@ --signer-workflow zvenson/fm1-build/.github/workflows/build.yml`. The packages hold three JieLi AC79 SDK files (Apache-2.0); `LICENSE`, `LICENSING.md` and `LICENSES.zip` carry every licence. Installing firmware is at your own risk.
          EOT
            } > release-body.md
            exit 0
          fi
          {
            if [ -f "docs/releases/$VERSION.md" ]; then cat "docs/releases/$VERSION.md"; echo; echo "---"; echo; fi
            sed -e "s/@VERSION@/$VERSION/g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" <<'EOT'
          ChoralRoot @VERSION@ for the M-VAVE FM-1 (identity FM-1_920).

          Install from the browser at https://quixotic7.github.io/ChoralRootFM1/ (Chrome or Edge, the FM-1 connected by USB), or with the command-line installer: `python3 tools/fm1_install.py choralroot-@VERSION@.fwsc`.

          `choralroot-@VERSION@-1core.fwsc` is the same firmware on one processor core, for an FM-1 that crashes or freezes with the standard package (the installer offers it under Advanced > Hardware fallback). Settings, sounds and loops stay when you switch between the two.

          `SHA256SUMS` lists both packages and their apps. GitHub built and signed each from this tag's source (The Firmware Hub's shared workflow); check one with `gh attestation verify choralroot-@VERSION@.fwsc --repo @REPO@ --signer-workflow zvenson/fm1-build/.github/workflows/build.yml`. The package holds three JieLi AC79 SDK files (Apache-2.0); `LICENSE`, `LICENSING.md` and `LICENSES.zip` carry every licence. Installing firmware is at your own risk.
          EOT
          } > release-body.md

      - name: The licence files (from the tag's tree; the build adds the packages)
        env:
          REL_BOARD: ${{ steps.version.outputs.board }}
        run: |
          set -euo pipefail
          mkdir assets
          cp LICENSE LICENSING.md assets/
          zip -q -r assets/LICENSES.zip LICENSES
          if [ "$REL_BOARD" = smk37 ]; then cp SMK37.md assets/; fi
          ls -l assets

      - name: Create or update the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.board == 'smk37' && format('ChoralRoot {0} for the SMK-37', steps.version.outputs.version) || format('ChoralRoot {0}', steps.version.outputs.version) }}
          # a draft until publish has checked the signed packages; a pre-release for X.Y-suffix only (a beta among
          # them); vX.Y is a full release, 0.x too (0.21 and 0.22 are the stable releases the installer offers by
          # default). An SMK build (X.Y-smk37, tested by SMK-37 owners since 0.29.2-smk37) is a full release too, a
          # pre-release only on a beta or rc base (X.Y-betaN-smk37); publish keeps it from being the latest
          draft: true
          prerelease: ${{ steps.version.outputs.board == 'smk37' && (contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc')) || steps.version.outputs.board != 'smk37' && contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
          body_path: release-body.md

  build:
    needs: draft
    # a tag: after the draft; a run from the Actions tab (no draft): on its own
    if: ${{ !failure() && !cancelled() }}
    # the hub trusts this workflow at refs/tags/v1 only: the tag, not a commit SHA (publish checks the commit)
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write                 # the packages into the draft release (a tag only)
      id-token: write                 # the attestation's signing certificate
      attestations: write
    with:
      build: bash tools/hub_build.sh
      packages: choralroot-*
      sdk: false                      # the three SDK files are vendored (tools/sdk; tools/build.py checks their SHA-256)

  publish:
    needs: [draft, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write                 # publish the draft
      actions: write                  # start pages.yml (a release made with GITHUB_TOKEN starts no workflow itself)
      attestations: read              # gh attestation verify
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      REL_BOARD: ${{ needs.draft.outputs.board }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            web/releases.json
            web/releases-smk37.json
            tools/hub_build.sh
          sparse-checkout-cone-mode: false

      - name: The draft's packages, signed by fm1-build v1 from this tag, as the lists pin them
        run: |
          set -euo pipefail
          mkdir signed
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir signed \
              --pattern 'choralroot-*' --pattern SHA256SUMS
          if [ "$REL_BOARD" = smk37 ]; then n=12; else n=4; fi      # the packages and their apps
          ls -l signed
          files=(signed/choralroot-*)
          if [ "${#files[@]}" != $n ] || [ "$(grep -c . signed/SHA256SUMS)" != $n ]; then
            echo "::error::the draft $GITHUB_REF_NAME does not have the $n packages and apps with their SHA256SUMS"
            exit 1
          fi
          (cd signed && sha256sum -c SHA256SUMS)
          for f in signed/choralroot-*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$FM1_BUILD" --signer-digest "$FM1_BUILD_V1_SHA" \
                --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          tools/hub_build.sh --check signed "$VERSION"

      - name: Publish the release
        # (an SMK build never becomes the latest release: the FM-1's stays it, for the hub and the Releases page)
        run: |
          set -euo pipefail
          if [ "$REL_BOARD" = smk37 ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

      - name: Publish the site (pages.yml)
        # a final release, or a beta (X.Y-betaN: web/releases.json lists it first with "beta": true; the installer
        # offers it only to who ticks "Show beta releases"). Other suffixes (-rc1, ...) do not publish the site
        if: ${{ env.REL_BOARD == 'fm1' && (!contains(env.VERSION, '-') || contains(env.VERSION, '-beta')) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # run from the default branch (the github-pages environment allows it), the site built from the tag
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f version="$VERSION" -f ref="$GITHUB_REF_NAME"
          echo "::notice::pages.yml started for $VERSION (Actions tab); the site follows in a minute or two"

      - name: Publish the site with the SMK-37 test build (pages.yml)
        # the site rebuilt from the SMK tag for the FM-1's current version (web/releases.json's first entry at the
        # tag: the FM-1's pages and packages as they are), so that webapp/smk37/ offers this build; only when
        # web/releases-smk37.json at the tag lists it
        if: ${{ env.REL_BOARD == 'smk37' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! python3 -c 'import json,sys; sys.exit(0 if any(r["version"]==sys.argv[1] for r in json.load(open("web/releases-smk37.json"))["releases"]) else 1)' "$VERSION" 2>/dev/null; then
            echo "::notice::$VERSION is not in web/releases-smk37.json at $GITHUB_REF_NAME: the release is made, the site stays as it is"
            exit 0
          fi
          fm1=$(python3 -c 'import json; print(json.load(open("web/releases.json"))["releases"][0]["version"])')
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f version="$fm1" -f ref="$GITHUB_REF_NAME"
          echo "::notice::pages.yml started for $fm1 from $GITHUB_REF_NAME (the SMK-37 test installer offers $VERSION)"
