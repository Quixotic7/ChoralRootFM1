# SPDX-License-Identifier: GPL-3.0-only
# Publish the GitHub Pages site (the landing page, the web installer and the package) for a release.
#   workflow_dispatch (version, ref)  -> download choralroot-VERSION.fwsc from the release vVERSION and every
#                                        other version of web/releases.json from its own release (the installer
#                                        offers them all; each is checked against the sha256 in releases.json),
#                                        and the single-core package (choralroot-X.Y-1core.fwsc) of every version
#                                        whose entry lists sha256_1core (docs/DUALCORE.md "Two packages"),
#                                        and the SMK-37 builds of web/releases-smk37.json (each version's
#                                        six packages from its own release vX.Y-smk37: the SMK-37 installer,
#                                        webapp/smk37/, linked from the landing page; SMK37.md),
#                                        build the browser emulators (Emscripten, build/emu-web -> emu/, and the
#                                        SMK-37's build/emu-web-smk37 -> webapp/smk37/emu/),
#                                        web/make_site.py --require-all, deploy to Pages
#   release published                 -> starts the dispatch above from the default branch (the github-pages
#                                        environment only accepts deployments from it), the site built from the tag
# release.yml starts the dispatch itself after it made the release. Settings -> Pages -> Source must be
# "GitHub Actions" (BUILDING.md, "Releasing").
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1 (the release v0.1 must carry choralroot-0.1.fwsc)"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit the site is built from (blank: the default branch)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # as release.yml: the generated headers (fonts with Raqm, samples) must match the firmware's
  PYTHON_VERSION: "3.11"
  PILLOW_VERSION: "11.1.0"
  FONTTOOLS_VERSION: "4.66.1"
  EMSDK_VERSION: "6.0.11"           # the Emscripten the browser emulator was made with (emsdk tag 6.0.11)
  NODE_VERSION: "22"

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the site build from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-beta[0-9]+)?$ ]]; then
            echo "::notice::release $TAG is not a vX.Y, vX.Y.Z or vX.Y-betaN tag: the site stays as it is (run pages.yml by hand to publish it)"
            exit 0
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f version="$version" -f ref="$TAG"
          echo "::notice::pages.yml started for $version"

  site:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::version '$VERSION' is not X.Y, X.Y.Z or X.Y-suffix (e.g. 0.1, without the v)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Download the package from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="choralroot-$VERSION.fwsc"
          mkdir -p build
          if ! gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$pkg" --dir build --clobber; then
            echo "::error title=No package for v$VERSION::The release v$VERSION does not exist or has no asset $pkg. Push the tag v$VERSION so release.yml builds and attaches it, or build locally (./build.sh --release $VERSION), upload build/release-$VERSION/* to the release v$VERSION by hand, then run pages.yml again with version $VERSION."
            exit 1
          fi
          # the release's SHA256SUMS, when it has one, must agree with the package
          if gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir build --clobber 2>/dev/null; then
            (cd build && sha256sum -c --ignore-missing SHA256SUMS)
          else
            echo "::warning::release v$VERSION has no SHA256SUMS; the package is not checked against it"
          fi
          ls -l "build/$pkg"

      - name: Download the other versions the installer offers (web/releases.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the installer offers every version of web/releases.json, and a browser cannot fetch a release asset
          # (no CORS headers on the download), so the site hosts them: build/packages/choralroot-X.Y.fwsc
          mkdir -p build/packages
          if ! python3 -c 'import json,sys; v=sys.argv[1]; r=json.load(open("web/releases.json"))["releases"]; sys.exit(0 if r and r[0]["version"]==v else 1)' "$VERSION"; then
            echo "::error title=web/releases.json does not start with $VERSION::The site is published for the newest version of web/releases.json. Add $VERSION there (bullets, date, tag, the package's sha256: docs/HANDOFF.md, Release steps) on the ref this site is built from, then run pages.yml again."
            exit 1
          fi
          # one line per version: version, tag, sha256, and the single-core package's sha256 or "-" (sha256_1core:
          # optional, docs/DUALCORE.md "Two packages"; 0.16 .. 0.21 have none)
          python3 -c 'import json; [print(r["version"], r["tag"], r["sha256"], r.get("sha256_1core") or "-") for r in json.load(open("web/releases.json"))["releases"]]' > build/packages/list.txt
          missing=""
          while read -r v tag sha sha1; do
            pkg="choralroot-$v.fwsc"
            if [ "$v" = "$VERSION" ]; then
              cp "build/$pkg" "build/packages/$pkg"
            elif ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$pkg" --dir build/packages --clobber; then
              echo "::error title=No package for version $v::web/releases.json lists version $v, but the release $tag does not exist or has no asset $pkg. Attach $pkg to the release $tag, or take $v out of web/releases.json, then run pages.yml again."
              missing="$missing $v"
              continue
            fi
            if ! echo "$sha  build/packages/$pkg" | sha256sum -c -; then
              echo "::error title=Wrong package for version $v::build/packages/$pkg (from the release $tag) does not have the sha256 web/releases.json lists for $v ($sha)."
              missing="$missing $v"
            fi
            if [ "$sha1" != "-" ]; then
              pkg1="choralroot-$v-1core.fwsc"
              if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$pkg1" --dir build/packages --clobber; then
                echo "::error title=No single-core package for version $v::web/releases.json lists sha256_1core for $v, but the release $tag has no asset $pkg1. Attach it (build/release-$v/$pkg1), or take sha256_1core out of $v's entry, then run pages.yml again."
                missing="$missing $v(1core)"
              elif ! echo "$sha1  build/packages/$pkg1" | sha256sum -c -; then
                echo "::error title=Wrong single-core package for version $v::build/packages/$pkg1 (from the release $tag) does not have the sha256_1core web/releases.json lists for $v ($sha1)."
                missing="$missing $v(1core)"
              fi
            fi
          done < build/packages/list.txt
          if [ -n "$missing" ]; then
            echo "::error::not published: version(s)$missing of web/releases.json have no usable package (see above)"
            exit 1
          fi
          ls -l build/packages

      - name: Download the SMK-37 test packages (web/releases-smk37.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the SMK-37 installer (webapp/smk37/, linked from the landing page) offers every version of web/releases-smk37.json; its
          # six packages come from that version's release (make_site.py checks each against the listed sha256)
          mkdir -p build/smk-packages
          if [ ! -f web/releases-smk37.json ]; then
            echo "::notice::no web/releases-smk37.json on this ref: the site has no SMK-37 installer"
            exit 0
          fi
          python3 -c 'import json; [print(r["version"], r["tag"]) for r in json.load(open("web/releases-smk37.json"))["releases"]]' > build/smk-packages/list.txt
          while read -r v tag; do
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "choralroot-$v*.fwsc" --dir build/smk-packages --clobber; then
              echo "::error title=No packages for SMK version $v::web/releases-smk37.json lists $v, but the release $tag does not exist or has no choralroot-$v*.fwsc. Attach the six packages of build/release-smk37/ to it, or take $v out of web/releases-smk37.json, then run pages.yml again."
              exit 1
            fi
          done < build/smk-packages/list.txt
          ls -l build/smk-packages

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python packages (Pillow with Raqm, fontTools)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0
          python3 -m pip install --disable-pip-version-check "Pillow==$PILLOW_VERSION" "fonttools==$FONTTOOLS_VERSION"
          python3 -c 'from PIL import features; import sys; ok = features.check("raqm"); print("raqm", features.version("raqm"), "fribidi", features.version("fribidi")); sys.exit(0 if ok else "Pillow has no Raqm layout (libfribidi missing?)")'

      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the browser emulator (tools/emu/web)
        run: |
          set -euo pipefail
          emcc --version | head -1
          # the generated headers only (build_web.sh would otherwise run the whole tools/build.py, which needs the
          # JieLi toolchain and SDK; the emulator needs neither)
          python3 -c 'import sys; sys.path.insert(0, "tools"); import build; build.generate()'
          CR_VERSION="$VERSION" sh tools/emu/web/build_web.sh
          node tools/emu/web/test_web_emu.mjs
          node tools/emu/web/test_web_emu_smk.mjs --no-page   # the SMK-37 emulator (webapp/smk37/emu/)

      - name: Make the site (web/make_site.py)
        run: |
          set -euo pipefail
          # make_site.py refuses a package without the identity FM-1_9xx or without Felucca's loader, and one
          # whose sha256 is not the one web/releases.json lists; --require-all: every listed version must be in
          # build/packages and VERSION must be the newest listed. It copies build/emu-web/ to emu/
          CR_SMK_PACKAGES_DIR=build/smk-packages python3 tests/releases_test.py
          python3 web/make_site.py "build/choralroot-$VERSION.fwsc" "$VERSION" build/site \
              --packages build/packages --smk-packages build/smk-packages --require-all
          for f in index.html webapp/installer/index.html "firmware/choralroot-$VERSION.fwsc" firmware/LICENSE \
                   firmware/index.html firmware/SHA256SUMS emu/index.html emu/choralroot.wasm; do
            if [ ! -s "build/site/$f" ]; then
              echo "::error::build/site/$f is missing"
              exit 1
            fi
          done
          while read -r v tag sha sha1; do
            if [ ! -s "build/site/firmware/choralroot-$v.fwsc" ]; then
              echo "::error::build/site/firmware/choralroot-$v.fwsc (version $v of web/releases.json) is missing"
              exit 1
            fi
            if [ "$sha1" != "-" ] && [ ! -s "build/site/firmware/choralroot-$v-1core.fwsc" ]; then
              echo "::error::build/site/firmware/choralroot-$v-1core.fwsc (version $v's single-core package) is missing"
              exit 1
            fi
          done < build/packages/list.txt
          (cd build/site/firmware && sha256sum -c SHA256SUMS)
          if [ -s build/smk-packages/list.txt ]; then   # the SMK-37 installer and its packages
            for f in webapp/smk37/index.html webapp/smk37/emu/index.html webapp/smk37/emu/choralroot-smk37.wasm \
                     firmware/smk37/index.html firmware/smk37/SHA256SUMS; do
              if [ ! -s "build/site/$f" ]; then
                echo "::error::build/site/$f is missing"
                exit 1
              fi
            done
            (cd build/site/firmware/smk37 && sha256sum -c SHA256SUMS)
            if ! grep -q 'href="webapp/smk37/"' build/site/index.html; then
              echo "::error::the landing page does not link the SMK-37 installer (web/site/index.html {{SMK}})"
              exit 1
            fi
            if grep -l "smk37" build/site/webapp/installer/index.html build/site/firmware/index.html build/site/emu/index.html; then
              echo "::error::an FM-1 installer, firmware or emulator page links the SMK-37 installer (the landing page alone does)"
              exit 1
            fi
          fi
          find build/site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
